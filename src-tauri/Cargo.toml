[package]
name = "memechan"
version = "0.1.0"
description = "A local-first meme library"
edition = "2021"
rust-version = "1.90"

[lib]
name = "memechan_core"

[[bin]]
name = "memechan"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:clipboard-rs"]

[build-dependencies]
tauri-build = { version = "2.7.1", optional = true, features = [] }

[dependencies]
tauri = { version = "2.12.1", optional = true, features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2.8.1", optional = true }
clipboard-rs = { version = "0.3.5", optional = true, features = ["wayland"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"
sha2 = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
gif = "0.14.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-27", "download-binaries", "tls-rustls", "copy-dylibs"] }
rapid-ocr-rs = { path = "../vendor/paddle-ocr-rs", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

# Keep pixel loops and codecs fast in tauri dev, while application code stays debuggable.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
